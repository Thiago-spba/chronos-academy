<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<title>Medindo superfícies · Chronos Academy</title>
<style>
  /* Fontes e biblioteca de animação ficam no próprio site (funciona mesmo com internet fraca). */
  @font-face{font-family:'Lexend'; font-weight:400; font-display:swap; src:url(/aulas-animadas/lib/lexend-400.woff2) format('woff2');}
  @font-face{font-family:'Lexend'; font-weight:700; font-display:swap; src:url(/aulas-animadas/lib/lexend-700.woff2) format('woff2');}
  *{box-sizing:border-box}
  body{margin:0}
  /* Layout: um unico quadro (cena SVG 1600x900) onde tudo e desenhado,
     escrito e transformado no mesmo lugar; controles grandes embaixo.
     As cores vem de 30 temas (JS); estes valores sao o tema 1 (quadro verde). */
  :root{
    --board:#17302a; --board2:#1f3d35; --chalk:#f4f0e6; --dim:#a9bdb4; --g1:#1d3a33; --g2:#142823;
    --yellow:#ffd166; --sky:#8fd3ff; --coral:#ff8f7e; --ok:#8ee89b; --line:#c9d6cf;
    --font:'Lexend','Segoe UI',system-ui,sans-serif;
    color-scheme: dark;
  }
  html,body{height:100%}
  body{background:var(--board); color:var(--chalk); font-family:var(--font); display:flex; flex-direction:column;}
  .palco{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding-inline:16px; padding-block:8px 0;}
  #cena{width:100%; height:100%; display:block; user-select:none; -webkit-user-select:none;}
  #cena text{font-family:var(--font);}
  .c-chalk{fill:var(--chalk)} .c-dim{fill:var(--dim)} .c-yellow{fill:var(--yellow)} .c-sky{fill:var(--sky)}
  .c-coral{fill:var(--coral)} .c-ok{fill:var(--ok)} .c-board{fill:var(--board)}
  .b{font-weight:700} .ls{letter-spacing:.12em}
  .traco{stroke:var(--chalk); stroke-width:5; fill:none; stroke-linecap:round}
  .traco-fino{stroke:var(--line); stroke-width:2.5; fill:none; opacity:.75}
  .traco-y{stroke:var(--yellow); stroke-width:4; fill:none; stroke-linecap:round}
  .quad-area{fill:var(--board2); stroke:var(--chalk); stroke-width:3}
  .celula{fill:var(--yellow)}
  .card-box{fill:var(--board2); stroke:var(--line); stroke-width:2.5}
  .card-coral{fill:var(--board2); stroke:var(--coral); stroke-width:3}
  .card-ok{fill:var(--board2); stroke:var(--ok); stroke-width:3}
  .alt{cursor:pointer}
  .alt-box{fill:var(--board2); stroke:var(--line); stroke-width:3; transition:stroke .15s}
  .alt:hover .alt-box{stroke:var(--sky)}
  .alt-box.sel{stroke:var(--yellow); stroke-width:7}
  .alt-circ{fill:var(--chalk)}
  .chip{cursor:pointer}
  .chip rect{fill:var(--board2); stroke:var(--sky); stroke-width:2.5}
  .chip:hover rect{fill:color-mix(in srgb, var(--board2) 82%, var(--chalk))}
  .sombra{fill:var(--dim); opacity:.55}

  .nav{padding-inline:16px; padding-block:10px calc(12px + env(safe-area-inset-bottom,0px)); display:flex; align-items:center; justify-content:space-between; gap:14px;}
  .botao{font-family:var(--font); font-weight:700; font-size:clamp(16px,1.8vw,22px); padding:12px 28px; border-radius:14px; cursor:pointer; transition:transform .12s, background .15s;}
  .botao:active{transform:scale(.97)}
  .botao:focus-visible{outline:3px solid var(--sky); outline-offset:3px}
  .botao:disabled{opacity:.35; cursor:default}
  .botao.principal{background:var(--yellow); color:var(--board); border:none;}
  .botao.secundario{background:transparent; color:var(--chalk); border:2px solid var(--line);}
  .dica{font-size:clamp(11px,1.2vw,14px); color:var(--dim); text-align:center;}
  .esq{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .botao.tema{font-size:clamp(12px,1.2vw,15px); font-weight:400; padding:10px 16px; background:transparent; color:var(--dim); border:1.5px dashed var(--line);}
  @media (max-width:560px){ .dica{display:none} }
  .girar{display:none; text-align:center; color:var(--yellow); font-size:15px; padding:14px 16px 0;}
  @media (orientation:portrait) and (max-width:700px){ .girar{display:block} }
</style>
</head>
<body>
<p class="girar">Dica: gire o celular para ver o quadro maior.</p>
<div class="palco">
  <svg id="cena" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Quadro da aula Medindo superfícies"></svg>
</div>
<div class="nav">
  <div class="esq">
    <button class="botao secundario" id="btnVoltar">Voltar</button>
    <button class="botao tema" id="btnFechar" title="Voltar para o Chronos">Fechar</button>
  </div>
  <span class="dica">Espaço ou → avança · ← volta · clique no meio da animação para pular</span>
  <button class="botao principal" id="btnAvancar">Começar</button>
</div>

<script src="/aulas-animadas/lib/gsap.min.js"></script>
<script>
(function(){
  var NS = 'http://www.w3.org/2000/svg';
  var svg = document.getElementById('cena');
  var btnAvancar = document.getElementById('btnAvancar');
  var btnVoltar = document.getElementById('btnVoltar');
  var btnFechar = document.getElementById('btnFechar');
  btnFechar.addEventListener('click', function(){
    if (window.history.length > 1) window.history.back(); else window.location.href = '/';
  });

  // ============================================================
  // 30 TEMAS DE CORES — o Chronos abre esta página com #temaN, onde
  // N = número da aula (1 a 30, depois recomeça): nunca repete antes da 31ª aula.
  // Contraste de todos os textos conferido (padrão WCAG).
  // ============================================================
  var TEMAS = [{"nome":"Quadro verde","bg":"#17302a","g1":"#1d3a33","g2":"#142823","card":"#1f3d35","chalk":"#f4f0e6","dim":"#a9bdb4","a1":"#ffd166","a2":"#8fd3ff","coral":"#ff8f7e","ok":"#8ee89b","line":"#c9d6cf"},{"nome":"Lousa preta","bg":"#151515","g1":"#202020","g2":"#0e0e0e","card":"#232323","chalk":"#f5f5f0","dim":"#b3b3ab","a1":"#ffd43b","a2":"#74c0fc","coral":"#ff8787","ok":"#8ce99a","line":"#cfcfc7"},{"nome":"Azul-marinho","bg":"#0f1d33","g1":"#16284a","g2":"#0b1628","card":"#1a2d4f","chalk":"#eef3ff","dim":"#a9b8d6","a1":"#ffcf5c","a2":"#7fd8ff","coral":"#ff9a8a","ok":"#88e3a6","line":"#c3cfe6"},{"nome":"Roxo noturno","bg":"#1e1533","g1":"#2a1e47","g2":"#150f25","card":"#2c2150","chalk":"#f3efff","dim":"#bcb0db","a1":"#ffd166","a2":"#7ee0e6","coral":"#ff9fb2","ok":"#94e8b4","line":"#cfc6e8"},{"nome":"Grafite","bg":"#22262b","g1":"#2c3137","g2":"#191c20","card":"#2e343b","chalk":"#f1f3f5","dim":"#b4bbc3","a1":"#ffc94d","a2":"#66d9e8","coral":"#ff948a","ok":"#8ee89b","line":"#c8ced4"},{"nome":"Vinho","bg":"#2a1218","g1":"#3a1a22","g2":"#1e0d11","card":"#3b1c25","chalk":"#fbeff1","dim":"#d4b4bb","a1":"#ffd166","a2":"#8fd3ff","coral":"#ffa08a","ok":"#9be8a8","line":"#e0c5ca"},{"nome":"Petróleo","bg":"#0e2a2f","g1":"#143a41","g2":"#0a1f23","card":"#173f47","chalk":"#edf8f9","dim":"#a9cbd0","a1":"#ffd166","a2":"#b5e0ff","coral":"#ffa08e","ok":"#9ef0b0","line":"#c0dde0"},{"nome":"Café","bg":"#2b2019","g1":"#3a2b21","g2":"#1f1712","card":"#3c2d23","chalk":"#f8efe6","dim":"#cfbcab","a1":"#ffd166","a2":"#9fd8ff","coral":"#ffa38f","ok":"#a2e8a0","line":"#decbbb"},{"nome":"Floresta","bg":"#10261b","g1":"#173524","g2":"#0b1c13","card":"#1a3a28","chalk":"#effaf2","dim":"#abcab6","a1":"#ffe066","a2":"#99e2ff","coral":"#ffa08e","ok":"#b2f2bb","line":"#c3dccb"},{"nome":"Índigo","bg":"#171c46","g1":"#20275e","g2":"#111436","card":"#242b66","chalk":"#f0f2ff","dim":"#b0b7e0","a1":"#ffd166","a2":"#7fe7dc","coral":"#ffa3aa","ok":"#9be8b0","line":"#c5cbee"},{"nome":"Ardósia","bg":"#1f2a36","g1":"#283645","g2":"#172029","card":"#2b3a4a","chalk":"#f0f4f8","dim":"#afbecc","a1":"#ffcc66","a2":"#89e0ff","coral":"#ffa196","ok":"#95e6a8","line":"#c8d3de"},{"nome":"Oceano","bg":"#062a3d","g1":"#0a3a54","g2":"#041f2e","card":"#0d4260","chalk":"#eaf7ff","dim":"#a6c9db","a1":"#ffd97a","a2":"#7ff0d2","coral":"#ffa597","ok":"#a3f0b2","line":"#bfdcea"},{"nome":"Berinjela","bg":"#2d1530","g1":"#3e1d42","g2":"#200f22","card":"#412046","chalk":"#fbf0fc","dim":"#d3b3d7","a1":"#ffd166","a2":"#8fe3ff","coral":"#ffa893","ok":"#9eeaa9","line":"#e1c7e4"},{"nome":"Musgo","bg":"#262a17","g1":"#343a1f","g2":"#1b1e10","card":"#373d22","chalk":"#f7f8ea","dim":"#c6caa8","a1":"#ffd166","a2":"#9ed8ff","coral":"#ffa08a","ok":"#b8f2a0","line":"#d8dcbd"},{"nome":"Noite estrelada","bg":"#13183a","g1":"#1c2350","g2":"#0d112a","card":"#1f2758","chalk":"#f2f4ff","dim":"#afb6de","a1":"#ffe08a","a2":"#8cf0ff","coral":"#ffa6b5","ok":"#9ff0c0","line":"#c8cdee"},{"nome":"Bege e verde","bg":"#f3ecdc","g1":"#f7f1e3","g2":"#ece2cc","card":"#fffaf0","chalk":"#1f2a22","dim":"#56635a","a1":"#1f6f2c","a2":"#1c5d99","coral":"#b0301f","ok":"#1b7a3e","line":"#8a9a8a"},{"nome":"Caderno","bg":"#f4f7fb","g1":"#ffffff","g2":"#e9eef6","card":"#ffffff","chalk":"#1b2533","dim":"#556071","a1":"#c2410c","a2":"#1d4ed8","coral":"#c01f1f","ok":"#237a36","line":"#9aa7b8"},{"nome":"Areia","bg":"#f1e6d6","g1":"#f6ede0","g2":"#e8d9c4","card":"#fbf5ec","chalk":"#2d241c","dim":"#65574a","a1":"#a8461a","a2":"#2a6685","coral":"#ab2219","ok":"#2c7437","line":"#a8957f"},{"nome":"Menta","bg":"#e3f4ec","g1":"#eefaf4","g2":"#d4ece0","card":"#f7fdfa","chalk":"#13302a","dim":"#46645b","a1":"#a14a06","a2":"#0c6a83","coral":"#b01a1a","ok":"#13763a","line":"#8fb3a6"},{"nome":"Céu","bg":"#e2eefb","g1":"#eef5fd","g2":"#d3e4f7","card":"#f8fbff","chalk":"#10233d","dim":"#475a74","a1":"#b93c0b","a2":"#1d4ed8","coral":"#b01a1a","ok":"#13763a","line":"#93a9c6"},{"nome":"Lavanda","bg":"#ece8f7","g1":"#f5f2fc","g2":"#e0daf1","card":"#fbfaff","chalk":"#241a3d","dim":"#574e72","a1":"#a14a06","a2":"#6325cf","coral":"#b3113a","ok":"#13763a","line":"#a79dc4"},{"nome":"Pêssego","bg":"#fbe9df","g1":"#fdf2ec","g2":"#f5dccd","card":"#fff9f5","chalk":"#3a1f14","dim":"#735446","a1":"#a14a06","a2":"#0c6582","coral":"#b01a1a","ok":"#2a7433","line":"#c7a594"},{"nome":"Quadriculado","bg":"#eef0f2","g1":"#f7f8f9","g2":"#e3e6e9","card":"#ffffff","chalk":"#1c1f24","dim":"#565d65","a1":"#b93c0b","a2":"#0a6878","coral":"#bf2424","ok":"#237a36","line":"#9ca3ab"},{"nome":"Limão","bg":"#f1f5dc","g1":"#f7faea","g2":"#e6edc9","card":"#fdfff4","chalk":"#25300f","dim":"#57633e","a1":"#8f2f10","a2":"#1b54a0","coral":"#b01a1a","ok":"#2a7433","line":"#a5b08a"},{"nome":"Rosa","bg":"#f8e6ec","g1":"#fcf1f5","g2":"#f0d6e0","card":"#fffafc","chalk":"#3a1422","dim":"#734d5e","a1":"#a14a06","a2":"#1a58a0","coral":"#b3113a","ok":"#2a7433","line":"#c79eb0"},{"nome":"Azul royal","bg":"#1e3a8a","g1":"#2748a8","g2":"#172e6e","card":"#2a4bb0","chalk":"#ffffff","dim":"#d0dbf8","a1":"#ffd43b","a2":"#a5f3fc","coral":"#ffbdb2","ok":"#c3f8d2","line":"#d6def7"},{"nome":"Verde-bandeira","bg":"#0f4526","g1":"#135a31","g2":"#0b361d","card":"#145c33","chalk":"#ffffff","dim":"#cfeada","a1":"#ffe066","a2":"#bfe3ff","coral":"#ffc8bd","ok":"#e0fbe4","line":"#d6eedd"},{"nome":"Brasa","bg":"#3b1d0a","g1":"#4f2810","g2":"#2b1507","card":"#53301a","chalk":"#fff4ea","dim":"#dcc2ad","a1":"#ffd166","a2":"#9fd8ff","coral":"#ffaca4","ok":"#a8eba8","line":"#e6cdb9"},{"nome":"Turquesa","bg":"#0b3f3f","g1":"#0f5050","g2":"#083030","card":"#115656","chalk":"#f2ffff","dim":"#c0e4e4","a1":"#ffd166","a2":"#c9e9ff","coral":"#ffc8bd","ok":"#cdf9d1","line":"#c9eaea"},{"nome":"Carmim","bg":"#4a1020","g1":"#5e1529","g2":"#380b18","card":"#65192e","chalk":"#fff1f4","dim":"#e6bfc9","a1":"#ffd43b","a2":"#b3e8ff","coral":"#ffbfae","ok":"#bff5c6","line":"#ecc7d0"}];
  var temaAtual = 0;
  function claro(hex){ var n = parseInt(hex.slice(1), 16); return ((n >> 16) * .299 + ((n >> 8) & 255) * .587 + (n & 255) * .114) > 150; }
  function aplicarTema(i){
    temaAtual = (i % TEMAS.length + TEMAS.length) % TEMAS.length;
    var t = TEMAS[temaAtual], r = document.documentElement.style;
    [['--board',t.bg],['--g1',t.g1],['--g2',t.g2],['--board2',t.card],['--chalk',t.chalk],['--dim',t.dim],
     ['--yellow',t.a1],['--sky',t.a2],['--coral',t.coral],['--ok',t.ok],['--line',t.line]].forEach(function(p){ r.setProperty(p[0], p[1]); });
    r.setProperty('color-scheme', claro(t.bg) ? 'light' : 'dark');
  }
  (function(){
    var m = /^#tema(\d+)$/.exec(location.hash || ''), ini = 0;
    if (m) ini = parseInt(m[1], 10) - 1;
    aplicarTema(ini);
  })();

  function el(tag, attrs, parent){
    var e = document.createElementNS(NS, tag);
    if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e);
    return e;
  }
  // *palavra* = destaque em amarelo
  function txt(str, attrs, parent){
    var t = el('text', attrs, parent);
    String(str).split('*').forEach(function(p, i){
      if (!p) return;
      if (i % 2){ var s = el('tspan', {'class':'c-yellow b'}, t); s.textContent = p; }
      else t.appendChild(document.createTextNode(p));
    });
    return t;
  }

  if (!window.gsap){
    txt('Não foi possível carregar a animação.', {x:800, y:430, 'text-anchor':'middle', 'font-size':44, 'class':'c-chalk'});
    txt('Verifique a internet e recarregue a página.', {x:800, y:490, 'text-anchor':'middle', 'font-size':32, 'class':'c-dim'});
    btnAvancar.disabled = true; btnVoltar.disabled = true;
    return;
  }

  // ============================================================
  // CONTEÚDO DA AULA
  // Fonte: Currículo em Ação SEDUC-SP, 2ª série EM, 4º bimestre,
  // "Medindo superfícies". Todo termo novo tem definição + explicação.
  // ============================================================
  var AULA = {
    titulo: 'Medindo superfícies',
    assinatura: 'Aula elaborada por Thiago Fernando, professor, graduando em Engenharia da Computação, licenciado em Matemática.',
    termos: {
      area: {chip:'Área', titulo:'ÁREA', secoes:[
        {rotulo:'O QUE É', linhas:['É a medida do tamanho','de uma superfície.']},
        {rotulo:'EXPLICANDO', linhas:['Contamos quantos quadrados de','tamanho conhecido cabem nela.']},
        {rotulo:'EXEMPLO', linhas:['O retângulo ao lado tem','área de 12 quadradinhos.']}]},
      m2: {chip:'m²', titulo:'METRO QUADRADO (m²)', secoes:[
        {rotulo:'O QUE É', linhas:['Área de um quadrado com','1 metro de cada lado.']},
        {rotulo:'EXPLICANDO', linhas:['O ² (lê-se "ao quadrado")','lembra: lado × lado.']},
        {rotulo:'EXEMPLO', linhas:['1 m × 1 m = 1 m²:','o tamanho de um tapete pequeno.']}]},
      km2: {chip:'km²', titulo:'QUILÔMETRO QUADRADO (km²)', secoes:[
        {rotulo:'O QUE É', linhas:['Área de um quadrado com','1 quilômetro de cada lado.']},
        {rotulo:'EXPLICANDO', linhas:['1 km = 1 000 metros.','Serve para medir cidades.']},
        {rotulo:'EXEMPLO', linhas:['Igarapava (SP) tem','468,2 km².']}]},
      ha: {chip:'hectare', titulo:'HECTARE (ha)', secoes:[
        {rotulo:'O QUE É', linhas:['Área de um quadrado com','100 metros de cada lado.']},
        {rotulo:'EXPLICANDO', linhas:['100 m × 100 m = 10 000 m².','Serve para medir fazendas.']},
        {rotulo:'EXEMPLO', linhas:['1 hectare é um pouco maior','que um campo de futebol.']}]},
      milhao: {chip:'milhão', titulo:'MILHÃO', secoes:[
        {rotulo:'O QUE É', linhas:['1 milhão = 1 000 000','(mil vezes mil).']},
        {rotulo:'EXPLICANDO', linhas:['2,66 milhões = 2,66 × 1 000 000','= 2 660 000.']},
        {rotulo:'EXEMPLO', linhas:['Meio milhão = 0,5 milhão','= 500 000.']}]},
      cm2: {chip:'cm²', titulo:'CENTÍMETRO QUADRADO (cm²)', secoes:[
        {rotulo:'O QUE É', linhas:['Área de um quadrado com','1 centímetro de cada lado.']},
        {rotulo:'EXPLICANDO', linhas:['1 cm é a distância entre dois','números seguidos da régua.']},
        {rotulo:'EXEMPLO', linhas:['A unha do dedo mindinho','tem mais ou menos 1 cm².']}]}
    }
  };
  var MOMENTOS = ['Curiosidade','Ver','Montar','Sua vez','Fechamento'];
  var MOMENTO_DO_PASSO = [0], momentoAtual = 0;

  var reduz = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var pronto = (document.fonts && document.fonts.ready)
    ? Promise.race([document.fonts.ready, new Promise(function(r){ setTimeout(r, 2500); })])
    : Promise.resolve();
  pronto.then(construir);

  function construir(){
    // ---------- camadas ----------
    var defs = el('defs');
    var grad = el('radialGradient', {id:'giz', cx:'50%', cy:'45%', r:'75%'}, defs);
    el('stop', {offset:'0%', style:'stop-color:var(--g1)'}, grad);
    el('stop', {offset:'100%', style:'stop-color:var(--g2)'}, grad);
    el('rect', {x:0, y:0, width:1600, height:900, rx:22, fill:'url(#giz)'});
    var L = {};
    ['quadro','painel','conta','faixa','cards','fecho','topo','legenda','chips','popup'].forEach(function(n){ L[n] = el('g'); });

    var tl = gsap.timeline({paused:true});
    var nPasso = 0;
    tl.addLabel('b0', 0);
    function fimPasso(){ MOMENTO_DO_PASSO.push(momentoAtual); nPasso++; var t = tl.duration(); tl.addLabel('b' + nPasso, t); tl.set({}, {}, t); }

    // ---------- utilidades de animação ----------
    function oculto(e){ gsap.set(e, {opacity:0}); return e; }
    function aparecer(e, pos, d){ tl.to(e, {opacity:1, duration:d || .45}, pos); }
    function sumir(e, pos, d){ tl.to(e, {opacity:0, duration:d || .3}, pos); }
    var nClip = 0;
    function escrever(t, pos, vel){ // efeito de "escrever com giz": revela da esquerda para a direita
      var bb = t.getBBox();
      var id = 'cl' + (++nClip);
      var cp = el('clipPath', {id:id, clipPathUnits:'userSpaceOnUse'}, defs);
      var r = el('rect', {x:bb.x - 8, y:bb.y - 14, width:0, height:bb.height + 28}, cp);
      t.setAttribute('clip-path', 'url(#' + id + ')');
      var w = bb.width + 16;
      tl.to(r, {attr:{width:w}, duration:Math.max(.35, w / (vel || 1000)), ease:'none'}, pos);
    }
    function tracar(e, pos, d){
      var len = e.getTotalLength();
      e.style.strokeDasharray = len; e.style.strokeDashoffset = len;
      tl.to(e, {strokeDashoffset:0, duration:d || .6, ease:'power1.inOut'}, pos);
    }
    var legAtual = null;
    function legenda(str, pos){
      var t = txt(str, {x:800, y:782, 'text-anchor':'middle', 'font-size':40, 'class':'c-chalk'}, L.legenda);
      if (legAtual){ sumir(legAtual, pos, .2); pos = '>'; }
      escrever(t, pos, 1500);
      legAtual = t;
      return t;
    }

    // ---------- topo: título + momentos da aula ----------
    txt(AULA.titulo, {x:60, y:66, 'font-size':34, 'class':'c-chalk b'}, L.topo);
    var momEls = MOMENTOS.map(function(m, i){ return txt((i + 1) + '  ' + m, {x:0, y:66, 'font-size':25, 'class':'c-dim'}, L.topo); });

    function voltar(){
      if (popupAberto){ fecharPopup(); return; }
      if (atual > 0) irPara(atual - 1, false);
    }
    btnAvancar.addEventListener('click', avancar);
    btnVoltar.addEventListener('click', voltar);
    svg.addEventListener('click', avancar);
    document.addEventListener('keydown', function(e){
      if (['ArrowRight','PageDown',' ','Enter'].indexOf(e.key) !== -1){ e.preventDefault(); avancar(); }
      else if (['ArrowLeft','PageUp'].indexOf(e.key) !== -1){ e.preventDefault(); voltar(); }
      else if (e.key === 'Escape') fecharPopup();
    });
    window.__aula = {irPara:irPara, total:N};
    tl.seek('b0');
    sync();
  }
})();
</script>

</body>
